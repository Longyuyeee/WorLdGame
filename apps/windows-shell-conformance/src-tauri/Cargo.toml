[package]
name = "world-windows-shell-conformance"
version = "0.0.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
