<script>
(()=>{

const routes={home:['项目首页','home'],scenes:['章节与场景','story'],writing:['场景写作','story'],stage:['演出编辑','story'],script:['文本脚本','story'],flow:['故事路线','story'],characters:['角色','story'],variables:['变量','story'],assets:['素材库','assets'],localization:['本地化与配音','assets'],collections:['内容收录','assets'],appearance:['游戏界面','appearance'],defaults:['玩家默认设置','appearance'],issues:['问题检查','issues'],debug:['运行调试','issues'],publish:['发布游戏','publish'],settings:['项目设置','settings'],backup:['备份与恢复','settings'],'player-title':['玩家 · 标题','player'],'player-play':['玩家 · 阅读','player'],'player-choice':['玩家 · 选择','player'],'player-saves':['玩家 · 存档','player'],'player-history':['玩家 · 历史','player'],'player-settings':['玩家 · 设置','player'],'player-extras':['玩家 · 回忆','player'],'player-ending':['玩家 · 结局','player']};

let saved=window.openai?.widgetState?.privateContent;
const state={route:routes[saved?.route]?saved.route:'writing',theme:saved?.theme||'light',device:saved?.device||'desktop',scenario:'normal',scene:'雨中的车站',selected:0,speakers:['夏音','主角'],dialogue:['雨停了。你还记得我们说过的话吗？','当然。我一直都记得。'],option:['留下来，陪她等下一班车','走向海边'],optionTargets:['留在车站','海边'],targetIndex:0,project:'雨后的约定',asset:'雨后的车站',assetFilter:'全部',publishStep:1,target:'Web',settingSection:'基本信息',playerReturn:'player-play',saveTab:'手动',locale:'日本語',collectionTab:'画廊',uiTab:'对话框',created:[],modal:'',parentModal:'',toastTimer:null};
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function table(headers,rows){return `<table class="wd-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function notice(){if(state.route==='home'||routes[state.route][1]==='player')return '';const notices={'save-error':['保存失败。这次修改还在本机，请重试或先导出工程副本。','retry-save','重试保存'],'missing':['当前场景的背景文件无法读取。剧情可以继续编辑。','repair','重新关联素材'],'readonly':['工程正在另一个窗口编辑。当前可以查看或导出副本。','readonly','查看原因'],'draft':['此场景的脚本有一处语法错误。修复后才能试玩和发布。','go:script','去修复']};const n=notices[state.scenario];return n?`<div class="wd-notice ${state.scenario==='save-error'?'error':''}" role="status"><span>${n[0]}</span>${btn(n[2],n[1])}</div>`:'';}
function render(){
product.dataset.theme=state.theme;product.classList.toggle('wd-phone',state.device==='mobile');root.querySelector('#wd-theme').value=state.theme;root.querySelector('#wd-device').value=state.device;

top.innerHTML=`<div class="wd-top-left">${btn('<span class="wd-logo">W</span>','go:home','wd-ghost','aria-label="返回项目首页"')}<span class="wd-project-title">${isHome?'WorLd Studio':esc(state.project)}</span>${!isHome&&!player?`<span class="wd-saved">${state.scenario==='save-error'?'● 未安全保存':state.scenario==='readonly'?'只读':'✓ 示例已保存'}</span>`:''}</div><div class="wd-top-right">${!isHome&&!player?btn('搜索','search','wd-ghost wd-search-button')+btn('▷ 试玩','go:player-title','wd-primary',state.scenario==='draft'?'disabled aria-label="请先修复脚本错误"':''):player?go('返回编辑器','writing'):btn('＋ 新建工程','new-project','wd-primary')}</div>`;
nav.hidden=isHome||player;root.querySelector('.wd-shell').style.gridTemplateColumns=isHome||player?'minmax(0,1fr)':'';
nav.innerHTML=[['story','book-open','故事','scenes'],['assets','image','素材','assets'],['appearance','palette','游戏外观','appearance'],['issues','circle-check','检查','issues'],['publish','send','发布','publish'],['settings','settings','设置','settings']].map(([g,i,l,r])=>go(`${icon(i)}<span>${l}</span>`,r,`${g===group?'active':''} ${g==='settings'?'wd-bottom':''} ${['appearance','publish','settings'].includes(g)?'wd-desktop-only':''}`)).join('')+btn(icon('ellipsis')+'<span>更多</span>','mobile-more',`wd-mobile-only ${['appearance','publish','settings'].includes(group)?'active':''}`);
const pages={home,scenes,writing,stage,script,flow,characters,variables,assets,localization,collections,appearance,defaults,issues,debug,publish,settings,backup,'player-title':playerTitle,'player-play':playerPlay,'player-choice':playerChoice,'player-saves':playerSaves,'player-history':playerHistory,'player-settings':playerSettings,'player-extras':playerExtras,'player-ending':playerEnding};
main.innerHTML=notice()+(!isHome&&!player?bar(group):'')+pages[state.route]();status.innerHTML=`<span>${player?'游戏预览':isHome?'本地创作 · 无需账户':esc(state.scene)+' · '+routes[state.route][0]}</span><span>设计稿 · 所有数据均为示例</span>`;
if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
if(state.scenario==='readonly'&&!player){main.querySelectorAll('textarea,input:not([id*="search"])').forEach(x=>x.disabled=true);main.querySelectorAll('button[data-act]').forEach(x=>{if(/^(new-|save-|apply-|create-|delete-|import-|choice-editor|character-edit|variable-edit|stage-object|motion-editor|connect|select-line|line-menu|pick-asset|audio)/.test(x.dataset.act))x.disabled=true;});}
}
function home(){return `<div class="wd-home">${heading('继续你的故事','打开一个工程，接着上次的位置写。',btn('导入工程','import-project'))}<section class="wd-home-feature">${art('雨后的约定')}<div><span class="wd-small wd-muted">最近编辑</span><h2>${esc(state.project)}</h2><p class="wd-muted">第一章 · ${esc(state.scene)}<br>保存在这台设备</p>${go('继续编辑','writing','wd-primary')} ${btn('工程选项','project-menu','wd-ghost')}</div></section><h3>其他工程</h3><div class="wd-grid">${['未命名的夏天','空白短篇',...state.created].map((x,i)=>`<button class="wd-item" data-act="open-project:${esc(x)}"><div class="wd-item-info"><h3>${esc(x)}</h3><p>${i?'空白工程':'本地工程'} · 打开</p></div></button>`).join('')}</div></div>`;}
function scenes(){if(state.scenario==='empty')return `<div class="wd-empty"><h2>从第一个场景开始</h2><p>先写一段对话，之后再加入背景、音乐与分支。</p>${btn('创建第一个场景','new-scene','wd-primary')}</div>`;return `<div class="wd-page">${heading('章节与场景','第一章 · 雨停之前',btn('＋ 新建场景','new-scene','wd-primary')+btn('章节管理','chapters'))}<div class="wd-toolbar"><span class="wd-muted wd-small">按故事顺序排列</span>${go('查看本章路线','flow')}</div><div class="wd-grid">${['校门口','雨中的车站','留在车站','海边',...state.created].map((x,i)=>`<button class="wd-item" data-act="open-scene:${esc(x)}">${art('',i===3?'filter:sepia(.4) saturate(.7)':'')}<div class="wd-item-info"><h3>${esc(x)}</h3><p>${i===1?'当前编辑 · 有分支':i===3?'结局场景':'场景'} · 点击继续写作</p></div></button>`).join('')}</div></div>`;}
function sceneRail(){return `<aside class="wd-scenes"><div class="wd-row"><strong class="wd-small">第一章</strong>${btn('⋯','chapters','wd-ghost','aria-label="章节管理"')}</div><p class="wd-muted wd-small">雨停之前</p>${['校门口','雨中的车站','留在车站','海边'].map(x=>btn(x,`open-scene:${x}`,x===state.scene?'active':'')).join('')}<hr class="wd-divider">${btn('＋ 新建场景','new-scene','wd-ghost')}${go('本章路线','flow','wd-ghost')}</aside>`;}

function stage(){return `<div class="wd-page">${heading(state.scene,'第一章 / 场景演出',btn('场景列表','scene-picker')+btn('对象属性','stage-object'))}${tabs()}<div class="wd-stage-layout"><div class="wd-stage"><div class="wd-art"><button class="wd-stage-target" data-act="stage-object">夏音<br><small>示例角色占位</small></button><div class="wd-art-caption">${esc(state.dialogue[0])}</div></div><div class="wd-row" style="margin-top:12px">${btn('▶ 预览演出','preview')}${btn('更换背景','pick-asset')}${btn('添加角色','character-picker')}<label class="wd-small"><input type="checkbox" checked> 安全区</label></div></div><aside class="wd-stage-properties"><h3>夏音</h3><p class="wd-muted wd-small">只显示当前选中对象的属性</p>${field('表情',select(['普通','微笑','难过']))}<div class="wd-two">${field('X 位置',input('640'))}${field('Y 位置',input('120'))}</div>${field('入场',select(['淡入','从左滑入','立即显示']))}${btn('曲线与关键帧','motion-editor')}<details><summary>更多参数</summary>${field('旋转',input('0°'))}${field('图层',input('前景'))}</details></aside></div><div class="wd-timeline"><div class="wd-row"><strong>场景时间线</strong><span class="wd-muted wd-small">00:12 / 01:30</span>${btn('添加演出','add-content','wd-ghost')}</div>${[['背景','雨后的车站',100],['角色','夏音 · 淡入',58],['音频','雨停之后',80],['对白','雨停了。',64]].map(([a,b,w])=>`<div class="wd-track"><span>${a}</span><button class="wd-clip" style="width:${w}%" data-act="${a==='角色'?'motion-editor':a==='对白'?'line-menu:0':'audio'}">${b}</button></div>`).join('')}</div></div>`;}

function assets(){const data=[['雨后的车站','背景'],['海边黄昏','背景'],['夏音 · 普通','立绘'],['雨停之后','音乐'],['夏音 · 第一场对白','配音'],['夜空','背景']].filter(([,type])=>state.assetFilter==='全部'||type===state.assetFilter);return `<div class="wd-page">${heading('素材库','导入、寻找和替换工程里的素材。',btn('导入素材','import-assets','wd-primary'))}<div class="wd-toolbar"><div class="wd-filter">${['全部','背景','立绘','音乐','配音'].map(x=>btn(x,`asset-filter:${x}`,state.assetFilter===x?'active':'')).join('')}</div><input id="wd-asset-search" placeholder="搜索素材名称" aria-label="搜索素材"></div><div class="wd-grid">${data.map(([n,t],i)=>`<button class="wd-item" data-act="asset-detail:${n}" data-asset-name="${n}">${t==='音乐'||t==='配音'?`<div style="height:125px;display:grid;place-items:center;background:var(--wd-soft)"><span style="font-size:32px;color:var(--wd-accent)">♫</span></div>`:art('',i===1?'filter:sepia(.65)':'')}<div class="wd-item-info"><h3>${n}</h3><p>${t} <span class="wd-chip">${state.scenario==='missing'&&i===0?'文件缺失':'已导入'}</span></p></div></button>`).join('')}</div></div>`;}

function collections(){return `<div class="wd-page">${heading('内容收录','设置玩家何时能在回忆页看见内容。',btn('＋ 新建收录项','collection-edit','wd-primary'))}<div class="wd-filter">${['画廊','音乐室','结局','场景回想'].map(x=>btn(x,`collection-tab:${x}`,state.collectionTab===x?'active':'')).join('')}</div><div style="margin-top:20px">${table(['内容','解锁条件','展示','操作'],[[state.collectionTab==='音乐室'?'雨停之后':'雨中的车站','在故事中首次出现','锁定时隐藏名称',btn('编辑','collection-edit')],[state.collectionTab==='结局'?'向着大海':'海边黄昏','到达结局「向着大海」','未解锁时显示占位',btn('编辑','collection-edit')]])}</div></div>`;}

function publish(){let content='';if(state.publishStep===1)content=`<h2>选择发布平台</h2><div class="wd-options">${['Web','Windows','Android'].map(x=>btn(x+`<small>${x==='Web'?'浏览器与离线网页':x==='Windows'?'桌面程序':'当前尚未开放'}</small>`,`target:${x}`,x===state.target?'active':'',x==='Android'?'disabled':'')).join('')}</div><h3>导出形式</h3>${field('交付文件',select(state.target==='Web'?['单文件网页','网页目录 ZIP']:['Windows 安装包','Windows 便携目录']))}<details><summary>高级资源优化</summary><label><input type="checkbox" checked> 安全无损优化</label><p class="wd-muted wd-small">检测无收益或不支持的资源时使用原素材。完整报告在导出后查看。</p></details>${btn('下一步：检查工程','publish-next','wd-primary')}`;else if(state.publishStep===2)content=`<h2>导出前检查</h2>${['故事入口与场景引用','素材完整性','存档与玩家配置'].map(x=>`<div class="wd-list-row"><span>${x}</span><span style="color:var(--wd-ok)">✓ 示例通过</span></div>`).join('')}<div class="wd-row" style="margin-top:24px">${btn('上一步','publish-prev')}${btn('生成游戏文件','publish-next','wd-primary')}</div>`;else content=`<div class="wd-empty" style="padding:45px 0"><span style="font-size:34px;color:var(--wd-ok)">✓</span><h2>导出结果示例</h2><p>雨后的约定 · ${state.target==='Web'?'单文件网页':'Windows 程序'}<br>这里展示成功后的界面，原型不会生成真实游戏文件。</p><div class="wd-row" style="justify-content:center">${go('试玩界面','player-title','wd-primary')}${btn('查看交付清单','build-result')}${btn('重新导出','publish-reset')}</div></div><details><summary>优化报告与构建日志</summary><p class="wd-muted">报告独立查看，不进入写作预览栏。此处为结构示例。</p></details>`;return `<div class="wd-page">${heading('发布游戏','把工程交给玩家。发布设置集中在这里。')}<div class="wd-steps">${['平台与形式','检查工程','导出结果'].map((x,i)=>`<span class="${state.publishStep===i+1?'active':''}">${i+1} · ${x}</span>`).join('')}</div><section style="max-width:650px">${content}</section></div>`;}

if(a==='exit-title'||a==='new-game'){modal(a==='new-game'?'开始新的故事':'返回标题',`<p>${a==='new-game'?'将从故事开头开始。旧存档仍可从读取存档中找到。':'先保住当前位置，再返回标题。保存失败时会留在游戏中。'}</p>`,cancel()+go(a==='new-game'?'开始新故事':'保存并返回标题',a==='new-game'?'player-play':'player-title','wd-primary'));return;}
if(a==='gallery-open'){modal(state.collectionTab==='音乐室'?'雨停之后':'雨后的车站',art('')+`<p class="wd-muted" style="margin-top:14px">已经解锁的内容。未解锁项不显示剧透标题。</p>`,btn('返回回忆','close'),false,'gallery');return;}
if(a==='delete-project'||a==='delete-asset'||a==='delete-save'||a==='delete-line'){modal('确认删除',`<p>${a==='delete-asset'?'这个素材被 2 个场景引用。先替换引用才能删除。':a==='delete-project'?'仅删除本机工程。请先导出需要保留的副本。':'删除前确认所选内容，完成后显示结果和可用恢复方式。'}</p>`,cancel()+btn(a==='delete-asset'?'先替换引用':'确认删除','delete-confirm','wd-danger'));return;}
if(a==='delete-confirm'){dialog.close();toast('删除流程示例；设计稿中的示例数据仍保留');return;}
if(a==='issue-filter'){main.querySelectorAll('[data-issue-level]').forEach(x=>x.hidden=value!=='all'&&x.dataset.issueLevel!==value);main.querySelectorAll('.wd-filter button').forEach(x=>x.classList.toggle('active',x===control));return;}
if(a==='debug-start'||a==='debug-continue'||a==='debug-step'||a==='debug-stop'){const n=main.querySelector('#wd-debug-status');if(n)n.textContent=a==='debug-stop'?'已停止 · 可以返回编辑器':'示例会话 · 停在第一条对白';if(a==='debug-step')main.querySelector('#wd-debug-value').textContent='1';return;}
if(a==='suppress'){modal('忽略提醒',field('理由','<textarea placeholder="说明为什么这条提醒可以忽略"></textarea>')+`<p class="wd-muted">在已忽略的问题中可重新启用检查。</p>`,cancel()+btn('保存理由','save-local','wd-primary'));return;}
if(a==='apply-script'){state.scenario='normal';root.querySelector('#wd-scenario').value='normal';toast('脚本应用界面示例：完成后回到同一语句');render();return;}
if(a==='syntax-help'){modal('脚本语法',`<p>对话使用「角色：文本」。选择与跳转可以在可视化编辑器中创建后切到脚本查看。</p>`,btn('返回脚本','close'),true);return;}
if(a==='save-local'){dialog.close();toast('修改已在设计稿中确认');return;}
if(a==='export-project'||a==='export-locale'){modal('导出确认',`<p>${a==='export-project'?'工程副本包含剧情、配置与素材，用于备份和跨设备。':'翻译表包含源文本、目标译文、状态与稳定文本键。'}</p><p class="wd-muted">本原型仅展示导出流程，不生成业务文件。</p>`,btn('完成','close'));return;}
if(a==='build-result'){modal('交付清单',`<h3>雨后的约定</h3><p>游戏文件 / 资源摘要 / 优化报告 / 启动说明</p><p class="wd-muted">预览界面示例，未执行真实构建。</p>`,btn('完成','close'),true);return;}
if(a==='project-menu'){modal('工程选项',go('项目设置','settings')+go('备份与恢复','backup')+btn('导出副本','export-project'),cancel());return;}
if(a==='watch'||a==='add-locale'){modal(a==='watch'?'观察变量':'添加语言',field(a==='watch'?'表达式':'语言',input(a==='watch'?'与夏音的关系':'English')),cancel()+btn('添加','save-local','wd-primary'));return;}
if(a==='undo'){toast('撤销按钮位置示例：正式接入工程已有撤销记录');return;}
if(a==='player-auto'){control.textContent=control.textContent==='自动'?'停止自动':'自动';return;}
if(a==='reset-player-settings'){toast('已恢复示例默认设置');return;}
if(a==='format-script'){toast('格式化示例：正式实现保持语句身份与语义');return;}
if(a==='run-check'){toast('已刷新示例问题列表');return;}
if(a==='copy-diagnostic'){toast('诊断信息仅在高级设置中提供');return;}
});
root.addEventListener('change',e=>{if(e.target.id==='wd-theme'||e.target.id==='wd-setting-theme'){state.theme=e.target.value;render();persist();}if(e.target.id==='wd-device'){state.device=e.target.value;render();persist();}if(e.target.id==='wd-scenario'){state.scenario=e.target.value;render();}if(e.target.id==='wd-locale')state.locale=e.target.value;});
root.addEventListener('input',e=>{if(e.target.id==='wd-asset-search'){const q=e.target.value;main.querySelectorAll('[data-asset-name]').forEach(x=>x.hidden=!x.dataset.assetName.includes(q));}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{[top,nav,main,status].forEach(x=>x.inert=false);if(modalTrigger?.isConnected)modalTrigger.focus();});
root.addEventListener('keydown',e=>{if(!dialog.open||dialog.style.position!=='absolute')return;if(e.key==='Escape'){e.preventDefault();dialog.close();}if(e.key==='Tab'){const items=[...dialog.querySelectorAll('button,input,select,textarea,summary')].filter(x=>!x.disabled&&x.getClientRects().length);const i=items.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&i===items.length-1){e.preventDefault();items[0]?.focus();}}});
root.addEventListener('submit',e=>e.preventDefault());
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data&&routes[data.route]){state.route=data.route;state.theme=data.theme||state.theme;state.device=data.device||state.device;render();}});
render();
if(globalThis.Tweak){const tw=new Tweak({container:product,onChange:()=>product.style.setProperty('--wd-radius',state.corner+'px')});state.corner=10;tw.addSlider(state,'corner',{label:'内容容器圆角',min:2,max:16,unit:'px'});}
})();
</script>
