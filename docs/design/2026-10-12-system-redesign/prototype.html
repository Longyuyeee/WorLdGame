  const createIcons = ({
    icons = iconAndAliases,
    nameAttr = "data-lucide",
    attrs = {},
    root = document,
    inTemplates
  } = {}) => {
    if (!Object.values(icons).length) {
      throw new Error(
        "Please provide an icons object.\nIf you want to use all the icons you can import it like:\n `import { createIcons, icons } from 'lucide';\nlucide.createIcons({icons});`"
      );
    }
    if (typeof root === "undefined") {
      throw new Error("`createIcons()` only works in a browser environment.");
    }
    const elementsToReplace = Array.from(root.querySelectorAll(`[${nameAttr}]`));
    elementsToReplace.forEach((element) => replaceElement(element, { nameAttr, icons, attrs }));
    if (inTemplates) {
      const templates = Array.from(root.querySelectorAll("template"));
      templates.forEach(
        (template) => createIcons({
          icons,
          nameAttr,
          attrs,
          root: template.content,
          inTemplates
        })
      );
    }
    if (nameAttr === "data-lucide") {
      const deprecatedElements = root.querySelectorAll("[icon-name]");
      if (deprecatedElements.length > 0) {
        console.warn(
          "[Lucide] Some icons were found with the now deprecated icon-name attribute. These will still be replaced for backwards compatibility, but will no longer be supported in v1.0 and you should switch to data-lucide"
        );
        Array.from(deprecatedElements).forEach(
          (element) => replaceElement(element, { nameAttr: "icon-name", icons, attrs })
        );
      }
    }
  };

#world-design-root{font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.6;color:light-dark(#202737,#e6e8ee);width:100%;--wd-accent:#3564e9;--wd-radius:10px}
#world-design-root *{box-sizing:border-box}
#world-design-root [hidden]{display:none!important}
#world-design-root .wd-review{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 2px 16px;font-size:12px}
#world-design-root .wd-review b{font-weight:400;opacity:.6;margin-left:10px}
#world-design-root .wd-review>div{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#world-design-root .wd-review label{display:flex;align-items:center;gap:5px}
#world-design-root .wd-review select,#world-design-root .wd-review button{background:light-dark(#f2f3f7,#252a35);color:inherit;border:1px solid light-dark(#dadee5,#404752);border-radius:7px;padding:6px 8px;font:inherit}
#world-design-root .wd-product{--wd-bg:#f4f5f8;--wd-panel:#fff;--wd-ink:#202737;--wd-muted:#697384;--wd-line:#e5e8ef;--wd-soft:#eef3ff;--wd-danger:#b64345;--wd-ok:#287851;--wd-chrome:#fafbfc;background:var(--wd-bg);color:var(--wd-ink);border:1px solid var(--wd-line);border-radius:12px;overflow:hidden;position:relative;min-width:0;box-shadow:0 12px 34px #17233d0a}
#world-design-root .wd-product[data-theme=dark]{color-scheme:dark;--wd-bg:#171b24;--wd-panel:#202631;--wd-ink:#e8ebf2;--wd-muted:#a8b2c3;--wd-line:#353d4b;--wd-soft:#2b3857;--wd-accent:#90acff;--wd-danger:#ff9895;--wd-ok:#8cd0a8;--wd-chrome:#1c212b}
#world-design-root .wd-product[data-theme=paper]{--wd-bg:#f3eee5;--wd-panel:#fcf9f3;--wd-ink:#403c35;--wd-muted:#81776a;--wd-line:#e2dacf;--wd-soft:#eee8db;--wd-accent:#786348;--wd-chrome:#f8f3eb}
#world-design-root .wd-product[data-theme=system]{--wd-bg:light-dark(#f4f5f8,#171b24);--wd-panel:light-dark(#fff,#202631);--wd-ink:light-dark(#202737,#e8ebf2);--wd-muted:light-dark(#697384,#a8b2c3);--wd-line:light-dark(#e5e8ef,#353d4b);--wd-soft:light-dark(#eef3ff,#2b3857);--wd-accent:light-dark(#3564e9,#90acff);--wd-chrome:light-dark(#fafbfc,#1c212b)}
#world-design-root button,#world-design-root input,#world-design-root select,#world-design-root textarea{font:inherit}
#world-design-root .wd-product button{border:1px solid var(--wd-line);border-radius:7px;background:var(--wd-panel);color:var(--wd-ink);padding:7px 12px;min-height:34px;white-space:normal;cursor:var(--cursor-interaction,pointer)}
#world-design-root .wd-product button:hover{background:var(--wd-soft)}
#world-design-root .wd-product button:disabled{opacity:.45;cursor:default}
#world-design-root .wd-product .wd-primary{background:var(--wd-accent);border-color:var(--wd-accent);color:var(--wd-panel)}
#world-design-root .wd-product[data-theme=dark] .wd-primary{color:#111b35}
#world-design-root .wd-product .wd-ghost{background:transparent;border-color:transparent}
#world-design-root .wd-product .wd-danger{color:var(--wd-danger)}
#world-design-root .wd-product input:not([type=checkbox]):not([type=range]),#world-design-root .wd-product select,#world-design-root .wd-product textarea{width:100%;padding:9px 11px;border:1px solid var(--wd-line);border-radius:7px;background:var(--wd-panel);color:var(--wd-ink)}
#world-design-root .wd-product textarea{resize:vertical;min-height:80px;line-height:1.85}
#world-design-root .wd-product h1{font-size:25px;line-height:1.3;font-weight:600;margin:0 0 10px;letter-spacing:-.5px}
#world-design-root .wd-product h2{font-size:18px;line-height:1.4;font-weight:600;margin:0 0 12px}
#world-design-root .wd-product h3{font-size:15px;line-height:1.4;font-weight:600;margin:0 0 8px}
#world-design-root .wd-product p{margin:0 0 14px}
#world-design-root .wd-muted{color:var(--wd-muted)}
#world-design-root .wd-small{font-size:12px}

<script>
(()=>{
const root=document.getElementById('world-design-root');
const product=root.querySelector('.wd-product'), main=root.querySelector('#wd-main'), nav=root.querySelector('#wd-nav'), top=root.querySelector('#wd-top'), status=root.querySelector('#wd-status'), dialog=root.querySelector('#wd-dialog');
const routes={home:['项目首页','home'],scenes:['章节与场景','story'],writing:['场景写作','story'],stage:['演出编辑','story'],script:['文本脚本','story'],flow:['故事路线','story'],characters:['角色','story'],variables:['变量','story'],assets:['素材库','assets'],localization:['本地化与配音','assets'],collections:['内容收录','assets'],appearance:['游戏界面','appearance'],defaults:['玩家默认设置','appearance'],issues:['问题检查','issues'],debug:['运行调试','issues'],publish:['发布游戏','publish'],settings:['项目设置','settings'],backup:['备份与恢复','settings'],'player-title':['玩家 · 标题','player'],'player-play':['玩家 · 阅读','player'],'player-choice':['玩家 · 选择','player'],'player-saves':['玩家 · 存档','player'],'player-history':['玩家 · 历史','player'],'player-settings':['玩家 · 设置','player'],'player-extras':['玩家 · 回忆','player'],'player-ending':['玩家 · 结局','player']};
const groups={story:[['scenes','场景'],['flow','路线'],['characters','角色'],['variables','变量']],assets:[['assets','素材库'],['localization','本地化与配音'],['collections','内容收录']],appearance:[['appearance','游戏界面'],['defaults','玩家默认设置']],issues:[['issues','问题'],['debug','调试']],settings:[['settings','项目设置'],['backup','备份与恢复']]};
let saved=window.openai?.widgetState?.privateContent;
const state={route:routes[saved?.route]?saved.route:'writing',theme:saved?.theme||'light',device:saved?.device||'desktop',scenario:'normal',scene:'雨中的车站',selected:0,speakers:['夏音','主角'],dialogue:['雨停了。你还记得我们说过的话吗？','当然。我一直都记得。'],option:['留下来，陪她等下一班车','走向海边'],optionTargets:['留在车站','海边'],targetIndex:0,project:'雨后的约定',asset:'雨后的车站',assetFilter:'全部',publishStep:1,target:'Web',settingSection:'基本信息',playerReturn:'player-play',saveTab:'手动',locale:'日本語',collectionTab:'画廊',uiTab:'对话框',created:[],modal:'',parentModal:'',toastTimer:null};
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const btn=(label,act,kind='',extra='')=>`<button type="button" class="${kind}" data-act="${act}" ${extra}>${label}</button>`;
const go=(label,route,kind='')=>btn(label,`go:${route}`,kind);
const field=(label,control,hint='')=>`<label class="wd-field"><span>${label}</span>${control}${hint?`<small>${hint}</small>`:''}</label>`;
const input=(value='',id='')=>`<input value="${esc(value)}" ${id?`id="${id}"`:''}>`;
const select=(values,id='',chosen='')=>`<select ${id?`id="${id}"`:''}>${values.map(v=>`<option ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
const art=(caption='',style='')=>`<div class="wd-art" ${style?`style="${style}"`:''}>${caption?`<div class="wd-art-caption">${caption}</div>`:''}</div>`;
const heading=(title,subtitle='',actions='')=>`<div class="wd-page-head"><div><h1>${title}</h1>${subtitle?`<p class="wd-muted">${subtitle}</p>`:''}</div><div class="wd-row">${actions}</div></div>`;
function persist(){window.openai?.setWidgetState?.({modelContent:{page:routes[state.route][0],theme:state.theme,device:state.device},privateContent:{route:state.route,theme:state.theme,device:state.device}})?.catch(()=>{});}
function toast(msg){const box=root.querySelector('.wd-toast');box.textContent=msg;box.hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>box.hidden=true,3500);}
function navigate(route){if(!routes[route])return;if(dialog.open)dialog.close();state.modal='';state.route=route;render();persist();}
function bar(group){return groups[group]?`<div class="wd-sectionbar">${groups[group].map(([r,l])=>go(l,r,state.route===r?'active':'')).join('')}</div>`:'';}
function tabs(){return `<div class="wd-editor-tabs">${[['writing','写作'],['stage','演出'],['script','脚本']].map(([r,l])=>go(l,r,state.route===r?'active':'')).join('')}</div>`;}
function table(headers,rows){return `<table class="wd-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function notice(){if(state.route==='home'||routes[state.route][1]==='player')return '';const notices={'save-error':['保存失败。这次修改还在本机，请重试或先导出工程副本。','retry-save','重试保存'],'missing':['当前场景的背景文件无法读取。剧情可以继续编辑。','repair','重新关联素材'],'readonly':['工程正在另一个窗口编辑。当前可以查看或导出副本。','readonly','查看原因'],'draft':['此场景的脚本有一处语法错误。修复后才能试玩和发布。','go:script','去修复']};const n=notices[state.scenario];return n?`<div class="wd-notice ${state.scenario==='save-error'?'error':''}" role="status"><span>${n[0]}</span>${btn(n[2],n[1])}</div>`:'';}
function render(){
product.dataset.theme=state.theme;product.classList.toggle('wd-phone',state.device==='mobile');root.querySelector('#wd-theme').value=state.theme;root.querySelector('#wd-device').value=state.device;
const group=routes[state.route][1],player=group==='player',isHome=group==='home';
top.innerHTML=`<div class="wd-top-left">${btn('<span class="wd-logo">W</span>','go:home','wd-ghost','aria-label="返回项目首页"')}<span class="wd-project-title">${isHome?'WorLd Studio':esc(state.project)}</span>${!isHome&&!player?`<span class="wd-saved">${state.scenario==='save-error'?'● 未安全保存':state.scenario==='readonly'?'只读':'✓ 示例已保存'}</span>`:''}</div><div class="wd-top-right">${!isHome&&!player?btn('搜索','search','wd-ghost wd-search-button')+btn('▷ 试玩','go:player-title','wd-primary',state.scenario==='draft'?'disabled aria-label="请先修复脚本错误"':''):player?go('返回编辑器','writing'):btn('＋ 新建工程','new-project','wd-primary')}</div>`;
nav.hidden=isHome||player;root.querySelector('.wd-shell').style.gridTemplateColumns=isHome||player?'minmax(0,1fr)':'';
nav.innerHTML=[['story','book-open','故事','scenes'],['assets','image','素材','assets'],['appearance','palette','游戏外观','appearance'],['issues','circle-check','检查','issues'],['publish','send','发布','publish'],['settings','settings','设置','settings']].map(([g,i,l,r])=>go(`${icon(i)}<span>${l}</span>`,r,`${g===group?'active':''} ${g==='settings'?'wd-bottom':''} ${['appearance','publish','settings'].includes(g)?'wd-desktop-only':''}`)).join('')+btn(icon('ellipsis')+'<span>更多</span>','mobile-more',`wd-mobile-only ${['appearance','publish','settings'].includes(group)?'active':''}`);
const pages={home,scenes,writing,stage,script,flow,characters,variables,assets,localization,collections,appearance,defaults,issues,debug,publish,settings,backup,'player-title':playerTitle,'player-play':playerPlay,'player-choice':playerChoice,'player-saves':playerSaves,'player-history':playerHistory,'player-settings':playerSettings,'player-extras':playerExtras,'player-ending':playerEnding};
main.innerHTML=notice()+(!isHome&&!player?bar(group):'')+pages[state.route]();status.innerHTML=`<span>${player?'游戏预览':isHome?'本地创作 · 无需账户':esc(state.scene)+' · '+routes[state.route][0]}</span><span>设计稿 · 所有数据均为示例</span>`;
if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
if(state.scenario==='readonly'&&!player){main.querySelectorAll('textarea,input:not([id*="search"])').forEach(x=>x.disabled=true);main.querySelectorAll('button[data-act]').forEach(x=>{if(/^(new-|save-|apply-|create-|delete-|import-|choice-editor|character-edit|variable-edit|stage-object|motion-editor|connect|select-line|line-menu|pick-asset|audio)/.test(x.dataset.act))x.disabled=true;});}
}
function home(){return `<div class="wd-home">${heading('继续你的故事','打开一个工程，接着上次的位置写。',btn('导入工程','import-project'))}<section class="wd-home-feature">${art('雨后的约定')}<div><span class="wd-small wd-muted">最近编辑</span><h2>${esc(state.project)}</h2><p class="wd-muted">第一章 · ${esc(state.scene)}<br>保存在这台设备</p>${go('继续编辑','writing','wd-primary')} ${btn('工程选项','project-menu','wd-ghost')}</div></section><h3>其他工程</h3><div class="wd-grid">${['未命名的夏天','空白短篇',...state.created].map((x,i)=>`<button class="wd-item" data-act="open-project:${esc(x)}"><div class="wd-item-info"><h3>${esc(x)}</h3><p>${i?'空白工程':'本地工程'} · 打开</p></div></button>`).join('')}</div></div>`;}
function scenes(){if(state.scenario==='empty')return `<div class="wd-empty"><h2>从第一个场景开始</h2><p>先写一段对话，之后再加入背景、音乐与分支。</p>${btn('创建第一个场景','new-scene','wd-primary')}</div>`;return `<div class="wd-page">${heading('章节与场景','第一章 · 雨停之前',btn('＋ 新建场景','new-scene','wd-primary')+btn('章节管理','chapters'))}<div class="wd-toolbar"><span class="wd-muted wd-small">按故事顺序排列</span>${go('查看本章路线','flow')}</div><div class="wd-grid">${['校门口','雨中的车站','留在车站','海边',...state.created].map((x,i)=>`<button class="wd-item" data-act="open-scene:${esc(x)}">${art('',i===3?'filter:sepia(.4) saturate(.7)':'')}<div class="wd-item-info"><h3>${esc(x)}</h3><p>${i===1?'当前编辑 · 有分支':i===3?'结局场景':'场景'} · 点击继续写作</p></div></button>`).join('')}</div></div>`;}
function sceneRail(){return `<aside class="wd-scenes"><div class="wd-row"><strong class="wd-small">第一章</strong>${btn('⋯','chapters','wd-ghost','aria-label="章节管理"')}</div><p class="wd-muted wd-small">雨停之前</p>${['校门口','雨中的车站','留在车站','海边'].map(x=>btn(x,`open-scene:${x}`,x===state.scene?'active':'')).join('')}<hr class="wd-divider">${btn('＋ 新建场景','new-scene','wd-ghost')}${go('本章路线','flow','wd-ghost')}</aside>`;}
function writing(){const locked=state.scenario==='readonly';return `<div class="wd-writing">${sceneRail()}<section class="wd-document"><div class="wd-document-content"><div class="wd-breadcrumb">${btn('第一章','scene-picker','wd-ghost')} / ${esc(state.scene)}</div><div class="wd-page-head"><div><h1>${esc(state.scene)}</h1><p class="wd-muted wd-small">雨停下来的车站，还有一些未说完的话。</p></div>${btn('画面预览','preview')}</div>${tabs()}<div class="wd-cue"><span>▧ 背景 · ${esc(state.asset)}</span>${btn('更换','pick-asset','wd-ghost',locked?'disabled':'')}</div>${state.dialogue.map((text,i)=>`<article class="wd-dialogue ${state.selected===i?'selected':''}"><span class="wd-avatar">${i?'主':'夏'}</span><div><button type="button" class="wd-select" data-act="select-line:${i}"><strong>${i?'主角':'夏音'}</strong><p>${esc(text)}</p></button></div>${btn('⋯',`line-menu:${i}`,'wd-ghost wd-more','aria-label="编辑对白属性"')}</article>`).join('')}<div class="wd-cue"><span>♫ 音乐 · 雨停之后</span>${btn('调整','audio','wd-ghost',locked?'disabled':'')}</div><section class="wd-choice"><div class="wd-row"><strong>选择</strong><span class="wd-muted wd-small">2 条分支</span></div>${state.option.map(x=>btn('→ '+esc(x),'choice-editor','',locked?'disabled':'')).join('')}</section>${btn('＋ 添加内容','add-content','wd-add',locked?'disabled':'')}<div class="wd-row" style="margin-top:24px">${btn('撤销','undo','wd-ghost')}<span class="wd-muted wd-small">当前场景的内容与演出共用一份工程</span></div></div></section></div>`;}
function stage(){return `<div class="wd-page">${heading(state.scene,'第一章 / 场景演出',btn('场景列表','scene-picker')+btn('对象属性','stage-object'))}${tabs()}<div class="wd-stage-layout"><div class="wd-stage"><div class="wd-art"><button class="wd-stage-target" data-act="stage-object">夏音<br><small>示例角色占位</small></button><div class="wd-art-caption">${esc(state.dialogue[0])}</div></div><div class="wd-row" style="margin-top:12px">${btn('▶ 预览演出','preview')}${btn('更换背景','pick-asset')}${btn('添加角色','character-picker')}<label class="wd-small"><input type="checkbox" checked> 安全区</label></div></div><aside class="wd-stage-properties"><h3>夏音</h3><p class="wd-muted wd-small">只显示当前选中对象的属性</p>${field('表情',select(['普通','微笑','难过']))}<div class="wd-two">${field('X 位置',input('640'))}${field('Y 位置',input('120'))}</div>${field('入场',select(['淡入','从左滑入','立即显示']))}${btn('曲线与关键帧','motion-editor')}<details><summary>更多参数</summary>${field('旋转',input('0°'))}${field('图层',input('前景'))}</details></aside></div><div class="wd-timeline"><div class="wd-row"><strong>场景时间线</strong><span class="wd-muted wd-small">00:12 / 01:30</span>${btn('添加演出','add-content','wd-ghost')}</div>${[['背景','雨后的车站',100],['角色','夏音 · 淡入',58],['音频','雨停之后',80],['对白','雨停了。',64]].map(([a,b,w])=>`<div class="wd-track"><span>${a}</span><button class="wd-clip" style="width:${w}%" data-act="${a==='角色'?'motion-editor':a==='对白'?'line-menu:0':'audio'}">${b}</button></div>`).join('')}</div></div>`;}
function script(){return `<div class="wd-writing">${sceneRail()}<section class="wd-document"><div class="wd-breadcrumb">第一章 / ${esc(state.scene)}</div><h1>${esc(state.scene)}</h1>${tabs()}${state.scenario==='draft'?'<p class="wd-danger" role="alert">第 5 行：选项缺少目标场景。选择一个场景后再运行。</p>':''}<label class="wd-field"><span>故事脚本</span><textarea id="wd-script" rows="16" style="font-family:Consolas,monospace">@background station_after_rain\n@audio rain_stops loop\n夏音：${esc(state.dialogue[0])}\n主角：${esc(state.dialogue[1])}\n@choice\n  留下来 → stay\n  走向海边 → seaside\n@end</textarea></label><div class="wd-row">${btn('应用脚本','apply-script','wd-primary')}${btn('格式化','format-script')}${btn('语法帮助','syntax-help','wd-ghost')}</div></section></div>`;}
function flow(){return `<div class="wd-page">${heading('故事路线','第一章 · 只展示场景之间的走向',btn('连接场景','connect')+btn('查看路线清单','route-list'))}<div class="wd-route" aria-label="第一章六个场景的路线"><svg class="wd-lines" viewBox="0 0 780 400" preserveAspectRatio="none" role="img" aria-label="校门口到车站，分为留在车站与海边，再到两个结局"><path d="M390 70V140 M390 190C390 230 140 230 140 270 M390 190C390 230 640 230 640 270 M140 320V360 M640 320V360"/></svg>${[['校门口',37,0,'开始'],['雨中的车站',37,27,'2 条分支'],['留在车站',5,56,'陪她等车'],['海边',69,56,'走向海边'],['结局 · 雨停之后',5,82,'结局'],['结局 · 向着大海',69,82,'结局']].map(([n,x,y,d],i)=>`<button class="wd-node ${i>3?'end':''}" style="left:${x}%;top:${y}%" data-act="route-node:${n}"><strong>${n}</strong><small>${d}</small></button>`).join('')}<span class="wd-route-label" style="left:24%;top:48%">选择「留下来」</span><span class="wd-route-label" style="left:60%;top:48%">选择「走向海边」</span></div><div class="wd-list-row"><div><strong>路线检查</strong><p>从入口可到达两个结局。单个场景的对白在场景编辑器里修改。</p></div>${go('打开当前场景','writing','wd-primary')}</div></div>`;}
function characters(){return `<div class="wd-page">${heading('角色','角色名、表情与立绘集中管理。',btn('＋ 新建角色','character-new','wd-primary'))}${table(['角色','立绘与表情','引用','操作'],[['<span class="wd-row"><span class="wd-avatar">夏</span>夏音</span>','普通 / 微笑 / 难过','4 个场景',btn('编辑','character-edit')],['主角','以文字为主','4 个场景',btn('编辑','character-edit')]])}</div>`;}
function variables(){return `<div class="wd-page">${heading('变量','在选项和条件中使用，不需要每次记住变量 ID。',btn('＋ 新建变量','variable-new','wd-primary'))}${table(['名称','类型 / 初始值','用途','操作'],[['与夏音的关系','数字 · 0','3 处条件',btn('编辑','variable-edit')],['是否留在车站','开关 · 关闭','2 处条件',btn('编辑','variable-edit')]])}</div>`;}
function assets(){const data=[['雨后的车站','背景'],['海边黄昏','背景'],['夏音 · 普通','立绘'],['雨停之后','音乐'],['夏音 · 第一场对白','配音'],['夜空','背景']].filter(([,type])=>state.assetFilter==='全部'||type===state.assetFilter);return `<div class="wd-page">${heading('素材库','导入、寻找和替换工程里的素材。',btn('导入素材','import-assets','wd-primary'))}<div class="wd-toolbar"><div class="wd-filter">${['全部','背景','立绘','音乐','配音'].map(x=>btn(x,`asset-filter:${x}`,state.assetFilter===x?'active':'')).join('')}</div><input id="wd-asset-search" placeholder="搜索素材名称" aria-label="搜索素材"></div><div class="wd-grid">${data.map(([n,t],i)=>`<button class="wd-item" data-act="asset-detail:${n}" data-asset-name="${n}">${t==='音乐'||t==='配音'?`<div style="height:125px;display:grid;place-items:center;background:var(--wd-soft)"><span style="font-size:32px;color:var(--wd-accent)">♫</span></div>`:art('',i===1?'filter:sepia(.65)':'')}<div class="wd-item-info"><h3>${n}</h3><p>${t} <span class="wd-chip">${state.scenario==='missing'&&i===0?'文件缺失':'已导入'}</span></p></div></button>`).join('')}</div></div>`;}
function localization(){return `<div class="wd-page">${heading('本地化与配音','源语言：简体中文',btn('添加语言','add-locale')+btn('导入翻译','import-locale')+btn('导出翻译表','export-locale'))}<div class="wd-toolbar"><label class="wd-row">目标语言 ${select(['日本語','English'],'wd-locale',state.locale)}</label><span class="wd-muted wd-small">选中一行后翻译，不在素材页同时展开所有生产表。</span></div>${table(['源文本','译文','状态','操作'],[[esc(state.dialogue[0]),'雨が止んだね。あの約束、覚えてる？','待复核',btn('编辑','translation')],[esc(state.dialogue[1]),'もちろん。ずっと覚えている。','已完成',btn('编辑','translation')],['走向海边','未翻译','未翻译',btn('编辑','translation')]])}</div>`;}

function publish(){let content='';if(state.publishStep===1)content=`<h2>选择发布平台</h2><div class="wd-options">${['Web','Windows','Android'].map(x=>btn(x+`<small>${x==='Web'?'浏览器与离线网页':x==='Windows'?'桌面程序':'当前尚未开放'}</small>`,`target:${x}`,x===state.target?'active':'',x==='Android'?'disabled':'')).join('')}</div><h3>导出形式</h3>${field('交付文件',select(state.target==='Web'?['单文件网页','网页目录 ZIP']:['Windows 安装包','Windows 便携目录']))}<details><summary>高级资源优化</summary><label><input type="checkbox" checked> 安全无损优化</label><p class="wd-muted wd-small">检测无收益或不支持的资源时使用原素材。完整报告在导出后查看。</p></details>${btn('下一步：检查工程','publish-next','wd-primary')}`;else if(state.publishStep===2)content=`<h2>导出前检查</h2>${['故事入口与场景引用','素材完整性','存档与玩家配置'].map(x=>`<div class="wd-list-row"><span>${x}</span><span style="color:var(--wd-ok)">✓ 示例通过</span></div>`).join('')}<div class="wd-row" style="margin-top:24px">${btn('上一步','publish-prev')}${btn('生成游戏文件','publish-next','wd-primary')}</div>`;else content=`<div class="wd-empty" style="padding:45px 0"><span style="font-size:34px;color:var(--wd-ok)">✓</span><h2>导出结果示例</h2><p>雨后的约定 · ${state.target==='Web'?'单文件网页':'Windows 程序'}<br>这里展示成功后的界面，原型不会生成真实游戏文件。</p><div class="wd-row" style="justify-content:center">${go('试玩界面','player-title','wd-primary')}${btn('查看交付清单','build-result')}${btn('重新导出','publish-reset')}</div></div><details><summary>优化报告与构建日志</summary><p class="wd-muted">报告独立查看，不进入写作预览栏。此处为结构示例。</p></details>`;return `<div class="wd-page">${heading('发布游戏','把工程交给玩家。发布设置集中在这里。')}<div class="wd-steps">${['平台与形式','检查工程','导出结果'].map((x,i)=>`<span class="${state.publishStep===i+1?'active':''}">${i+1} · ${x}</span>`).join('')}</div><section style="max-width:650px">${content}</section></div>`;}

let modalTrigger=null;
function modal(title,body,footer='',drawer=false,key=''){state.modal=key;dialog.className=drawer?'wd-drawer':'';dialog.innerHTML=`<div class="wd-modal-head"><h2 id="wd-dialog-title">${title}</h2>${btn('×','close','wd-ghost','aria-label="关闭并返回"')}</div><div class="wd-modal-content">${body}</div>${footer?`<div class="wd-modal-footer">${footer}</div>`:''}`;if(!dialog.open){modalTrigger=document.activeElement;if(state.device==='mobile'||product.clientWidth<=560){Object.assign(dialog.style,{position:'absolute',inset:'0',width:'100%',height:'100%',maxHeight:'100%',margin:'0',borderRadius:'0'});dialog.setAttribute('aria-modal','true');[top,nav,main,status].forEach(x=>x.inert=true);dialog.show();dialog.querySelector('button').focus();}else{dialog.removeAttribute('style');dialog.showModal();}}if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}

let choiceDraft=null;

function openChoice(){const d=choiceDraft||{option:state.option,targets:state.optionTargets};modal('编辑选项',d.option.map((x,i)=>`<section class="wd-option-edit"><h3>选项 ${i+1}</h3>${field('选项文本',input(x,`wd-option-${i}`))}${field('前往场景',select(['留在车站','海边','校门口'],`wd-option-target-${i}`,d.targets[i]))}<details><summary>条件与变量变化</summary>${field('出现条件',select(['始终显示','与夏音的关系 ≥ 1']))}${field('选择后',select(['不改变变量','与夏音的关系 + 1']))}${btn('选择其他目标',`target-picker:${i}`)}</details></section>`).join(''),cancel()+btn('完成','save-choice','wd-primary'),false,'choice');}
function picker(){modal('选择素材',`<p class="wd-muted">只选择当前需要的素材。导入后会返回这里。</p><div class="wd-grid">${['雨后的车站','海边黄昏','夜空'].map(x=>`<button class="wd-item" data-act="use-asset:${x}">${art('')}<div class="wd-item-info">${x}</div></button>`).join('')}</div><hr class="wd-divider">${btn('导入新素材','import-assets')}`,cancel(),true,'asset-picker');}
root.addEventListener('click',e=>{const control=e.target.closest('[data-act]');if(!control||control.disabled)return;const action=control.dataset.act;const [a,...rest]=action.split(':');const value=rest.join(':');
if(a==='go'){if(value==='player-settings')state.playerReturn=state.route;if(value==='player-extras')state.playerReturn='player-title';navigate(value);return;}
if(a==='close'){dialog.close();state.modal='';return;}
if(a==='open-scene'){state.scene=value;state.selected=0;navigate('writing');return;}
if(a==='open-project'){state.project=value;navigate('writing');return;}

if(a==='collection-tab'){state.collectionTab=value;render();return;}
if(a==='ui-tab'){state.uiTab=value;render();return;}
if(a==='setting-section'||a==='default-section'){state.settingSection=value;render();return;}

if(a==='save-tab'){state.saveTab=value;render();return;}

if(a==='line-menu'){state.selected=Number(value);modal('对白属性',field('说话人',select(['夏音','主角']))+field('配音',select(['未绑定','夏音 · 第一场对白']))+field('文字显示',select(['跟随默认','立即显示','逐字显示']))+`<details><summary>更多设置</summary>${field('文本键',input('自动生成'))}${btn('添加断点','add-breakpoint')}${btn('删除这条对白','delete-line','wd-danger')}</details>`,btn('完成','close','wd-primary'),true,'line-properties');return;}
if(a==='save-line'){state.dialogue[state.selected]=dialog.querySelector('#wd-line-text').value;dialog.close();render();toast('对白已在设计稿中更新');return;}
if(a==='choice-editor'){if(state.modal!=='target-picker')choiceDraft=null;openChoice();return;}
if(a==='save-choice'){const d=readChoiceDraft();state.option=d.option;state.optionTargets=d.targets;choiceDraft=null;dialog.close();render();toast('选项与目标已更新');return;}

root.addEventListener('change',e=>{if(e.target.id==='wd-theme'||e.target.id==='wd-setting-theme'){state.theme=e.target.value;render();persist();}if(e.target.id==='wd-device'){state.device=e.target.value;render();persist();}if(e.target.id==='wd-scenario'){state.scenario=e.target.value;render();}if(e.target.id==='wd-locale')state.locale=e.target.value;});

root.addEventListener('keydown',e=>{if(!dialog.open||dialog.style.position!=='absolute')return;if(e.key==='Escape'){e.preventDefault();dialog.close();}if(e.key==='Tab'){const items=[...dialog.querySelectorAll('button,input,select,textarea,summary')].filter(x=>!x.disabled&&x.getClientRects().length);const i=items.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&i===items.length-1){e.preventDefault();items[0]?.focus();}}});

})();
