&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#world-design-root{font-family:Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif;font-size:14px;line-height:1.6;color:light-dark(#202737,#e6e8ee);width:100%;--wd-accent:#3564e9;--wd-radius:10px}
#world-design-root *{box-sizing:border-box}
#world-design-root [hidden]{display:none!important}
#world-design-root .wd-review{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 2px 16px;font-size:12px}
#world-design-root .wd-review b{font-weight:400;opacity:.6;margin-left:10px}
#world-design-root .wd-review&gt;div{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#world-design-root .wd-review label{display:flex;align-items:center;gap:5px}
#world-design-root .wd-review select,#world-design-root .wd-review button{background:light-dark(#f2f3f7,#252a35);color:inherit;border:1px solid light-dark(#dadee5,#404752);border-radius:7px;padding:6px 8px;font:inherit}
#world-design-root .wd-product{--wd-bg:#f4f5f8;--wd-panel:#fff;--wd-ink:#202737;--wd-muted:#697384;--wd-line:#e5e8ef;--wd-soft:#eef3ff;--wd-danger:#b64345;--wd-ok:#287851;--wd-chrome:#fafbfc;background:var(--wd-bg);color:var(--wd-ink);border:1px solid var(--wd-line);border-radius:12px;overflow:hidden;position:relative;min-width:0;box-shadow:0 12px 34px #17233d0a}
#world-design-root .wd-product[data-theme=dark]{color-scheme:dark;--wd-bg:#171b24;--wd-panel:#202631;--wd-ink:#e8ebf2;--wd-muted:#a8b2c3;--wd-line:#353d4b;--wd-soft:#2b3857;--wd-accent:#90acff;--wd-danger:#ff9895;--wd-ok:#8cd0a8;--wd-chrome:#1c212b}
#world-design-root .wd-product[data-theme=paper]{--wd-bg:#f3eee5;--wd-panel:#fcf9f3;--wd-ink:#403c35;--wd-muted:#81776a;--wd-line:#e2dacf;--wd-soft:#eee8db;--wd-accent:#786348;--wd-chrome:#f8f3eb}
#world-design-root .wd-product[data-theme=system]{--wd-bg:light-dark(#f4f5f8,#171b24);--wd-panel:light-dark(#fff,#202631);--wd-ink:light-dark(#202737,#e8ebf2);--wd-muted:light-dark(#697384,#a8b2c3);--wd-line:light-dark(#e5e8ef,#353d4b);--wd-soft:light-dark(#eef3ff,#2b3857);--wd-accent:light-dark(#3564e9,#90acff);--wd-chrome:light-dark(#fafbfc,#1c212b)}
#world-design-root button,#world-design-root input,#world-design-root select,#world-design-root textarea{font:inherit}
#world-design-root .wd-product button{border:1px solid var(--wd-line);border-radius:7px;background:var(--wd-panel);color:var(--wd-ink);padding:7px 12px;min-height:34px;white-space:normal;cursor:var(--cursor-interaction,pointer)}
#world-design-root .wd-product button:hover{background:var(--wd-soft)}
#world-design-root .wd-product button:disabled{opacity:.45;cursor:default}
#world-design-root .wd-product .wd-primary{background:var(--wd-accent);border-color:var(--wd-accent);color:var(--wd-panel)}
#world-design-root .wd-product[data-theme=dark] .wd-primary{color:#111b35}
#world-design-root .wd-product .wd-ghost{background:transparent;border-color:transparent}
#world-design-root .wd-product .wd-danger{color:var(--wd-danger)}
#world-design-root .wd-product input:not([type=checkbox]):not([type=range]),#world-design-root .wd-product select,#world-design-root .wd-product textarea{width:100%;padding:9px 11px;border:1px solid var(--wd-line);border-radius:7px;background:var(--wd-panel);color:var(--wd-ink)}
#world-design-root .wd-product textarea{resize:vertical;min-height:80px;line-height:1.85}
#world-design-root .wd-product h1{font-size:25px;line-height:1.3;font-weight:600;margin:0 0 10px;letter-spacing:-.5px}
#world-design-root .wd-product h2{font-size:18px;line-height:1.4;font-weight:600;margin:0 0 12px}
#world-design-root .wd-product h3{font-size:15px;line-height:1.4;font-weight:600;margin:0 0 8px}
#world-design-root .wd-product p{margin:0 0 14px}
#world-design-root .wd-muted{color:var(--wd-muted)}

function notice(){if(state.route===&#x27;home&#x27;||routes[state.route][1]===&#x27;player&#x27;)return &#x27;&#x27;;const notices={&#x27;save-error&#x27;:[&#x27;保存失败。这次修改还在本机，请重试或先导出工程副本。&#x27;,&#x27;retry-save&#x27;,&#x27;重试保存&#x27;],&#x27;missing&#x27;:[&#x27;当前场景的背景文件无法读取。剧情可以继续编辑。&#x27;,&#x27;repair&#x27;,&#x27;重新关联素材&#x27;],&#x27;readonly&#x27;:[&#x27;工程正在另一个窗口编辑。当前可以查看或导出副本。&#x27;,&#x27;readonly&#x27;,&#x27;查看原因&#x27;],&#x27;draft&#x27;:[&#x27;此场景的脚本有一处语法错误。修复后才能试玩和发布。&#x27;,&#x27;go:script&#x27;,&#x27;去修复&#x27;]};const n=notices[state.scenario];return n?`&lt;div class=&quot;wd-notice ${state.scenario===&#x27;save-error&#x27;?&#x27;error&#x27;:&#x27;&#x27;}&quot; role=&quot;status&quot;&gt;&lt;span&gt;${n[0]}&lt;/span&gt;${btn(n[2],n[1])}&lt;/div&gt;`:&#x27;&#x27;;}

function writing(){const locked=state.scenario===&#x27;readonly&#x27;;return `&lt;div class=&quot;wd-writing&quot;&gt;${sceneRail()}&lt;section class=&quot;wd-document&quot;&gt;&lt;div class=&quot;wd-document-content&quot;&gt;&lt;div class=&quot;wd-breadcrumb&quot;&gt;${btn(&#x27;第一章&#x27;,&#x27;scene-picker&#x27;,&#x27;wd-ghost&#x27;)} / ${esc(state.scene)}&lt;/div&gt;&lt;div class=&quot;wd-page-head&quot;&gt;&lt;div&gt;&lt;h1&gt;${esc(state.scene)}&lt;/h1&gt;&lt;p class=&quot;wd-muted wd-small&quot;&gt;雨停下来的车站，还有一些未说完的话。&lt;/p&gt;&lt;/div&gt;${btn(&#x27;画面预览&#x27;,&#x27;preview&#x27;)}&lt;/div&gt;${tabs()}&lt;div class=&quot;wd-cue&quot;&gt;&lt;span&gt;▧ 背景 · ${esc(state.asset)}&lt;/span&gt;${btn(&#x27;更换&#x27;,&#x27;pick-asset&#x27;,&#x27;wd-ghost&#x27;,locked?&#x27;disabled&#x27;:&#x27;&#x27;)}&lt;/div&gt;${state.dialogue.map((text,i)=&gt;`&lt;article class=&quot;wd-dialogue ${state.selected===i?&#x27;selected&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;wd-avatar&quot;&gt;${i?&#x27;主&#x27;:&#x27;夏&#x27;}&lt;/span&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;wd-select&quot; data-act=&quot;select-line:${i}&quot;&gt;&lt;strong&gt;${i?&#x27;主角&#x27;:&#x27;夏音&#x27;}&lt;/strong&gt;&lt;p&gt;${esc(text)}&lt;/p&gt;&lt;/button&gt;&lt;/div&gt;${btn(&#x27;⋯&#x27;,`line-menu:${i}`,&#x27;wd-ghost wd-more&#x27;,&#x27;aria-label=&quot;编辑对白属性&quot;&#x27;)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;wd-cue&quot;&gt;&lt;span&gt;♫ 音乐 · 雨停之后&lt;/span&gt;${btn(&#x27;调整&#x27;,&#x27;audio&#x27;,&#x27;wd-ghost&#x27;,locked?&#x27;disabled&#x27;:&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;wd-choice&quot;&gt;&lt;div class=&quot;wd-row&quot;&gt;&lt;strong&gt;选择&lt;/strong&gt;&lt;span class=&quot;wd-muted wd-small&quot;&gt;2 条分支&lt;/span&gt;&lt;/div&gt;${state.option.map(x=&gt;btn(&#x27;→ &#x27;+esc(x),&#x27;choice-editor&#x27;,&#x27;&#x27;,locked?&#x27;disabled&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/section&gt;${btn(&#x27;＋ 添加内容&#x27;,&#x27;ad 7;雨停了。&#x27;,64]].map(([a,b,w])=&gt;`&lt;div class=&quot;wd-track&quot;&gt;&lt;span&gt;${a}&lt;/span&gt;&lt;button class=&quot;wd-clip&quot; style=&quot;width:${w}%&quot; data-act=&quot;${a===&#x27;角色&#x27;?&#x27;motion-editor&#x27;:a===&#x27;对白&#x27;?&#x27;line-menu:0&#x27;:&#x27;audio&#x27;}&quot;&gt;${b}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
function script(){return `&lt;div class=&quot;wd-writing&quot;&gt;${sceneRail()}&lt;section class=&quot;wd-document&quot;&gt;&lt;div class=&quot;wd-breadcrumb&quot;&gt;第一章 / ${esc(state.scene)}&lt;/div&gt;&lt;h1&gt;${esc(state.scene)}&lt;/h1&gt;${tabs()}${state.scenario===&#x27;draft&#x27;?&#x27;&lt;p class=&quot;wd-danger&quot; role=&quot;alert&quot;&gt;第 5 行：选项缺少目标场景。选择一个场景后再运行。&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;label class=&quot;wd-field&quot;&gt;&lt;span&gt;故事脚本&lt;/span&gt;&lt;textarea id=&quot;wd-script&quot; rows=&quot;16&quot; style=&quot;font-family:Consolas,monospace&quot;&gt;@background station_after_rain\n@audio rain_stops loop\n夏音：${esc(state.dialogue[0])}\n主角：${esc(state.dialogue[1])}\n@choice\n  留下来 → stay\n  走向海边 → seaside\n@end&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;wd-row&quot;&gt;${btn(&#x27;应用脚本&#x27;,&#x27;apply-script&#x27;,&#x27;wd-primary&#x27;)}${btn(&#x27;格式化&#x27;,&#x27;format-script&#x27;)}${btn(&#x27;语法帮助&#x27;,&#x27;syntax-help&#x27;,&#x27;wd-ghost&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;}
function flow(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;故事路线&#x27;,&#x27;第一章 · 只展示场景之间的走向&#x27;,btn(&#x27;连接场景&#x27;,&#x27;connect&#x27;)+btn(&#x27;查看路线清单&#x27;,&#x27;route-list&#x27;))}&lt;div class=&quot;wd-route&quot; aria-label=&quot;第一章六个场景的路线&quot;&gt;&lt;svg class=&quot;wd-lines&quot; viewBox=&quot;0 0 780 400&quot; preserveAspectRatio=&quot;none&quot; role=&quot;img&quot; aria-label=&quot;校门口到车站，分为留在车站与海边，再到两个结局&quot;&gt;&lt;path d=&quot;M390 70V140 M390 190C390 230 140 230 140 270 M390 190C390 230 640 230 640 270 M140 320V360 M640 320V360&quot;/&gt;&lt;/svg&gt;${[[&#x27;校门口&#x27;,37,0,&#x27;开始&#x27;],[&#x27;雨中的车站&#x27;,37,27,&#x27;2 条分支&#x27;],[&#x27;留在车站&#x27;,5,56,&#x27;陪她等车&#x27;],[&#x27;海边&#x27;,69,56,&#x27;走向海边&#x27;],[&#x27;结局 · 雨停之后&#x27;,5,82,&#x27;结局&#x27;],[&#x27;结局 · 向着大海&#x27;,69,82,&#x27;结局&#x27;]].map(([n,x,y,d],i)=&gt;`&lt;button class=&quot;wd-node ${i&gt;3?&#x27;end&#x27;:&#x27;&#x27;}&quot; style=&quot;left:${x}%;top:${y}%&quot; data-act=&quot;route-node:${n}&quot;&gt;&lt;strong&gt;${n}&lt;/strong&gt;&lt;small&gt;${d}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;span class=&quot;wd-route-label&quot; style=&quot;left:24%;top:48%&quot;&gt;选择「留下来」&lt;/span&gt;&lt;span class=&quot;wd-route-label&quot; style=&quot;left:60%;top:48%&quot;&gt;选择「走向海边」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wd-list-row&quot;&gt;&lt;div&gt;&lt;strong&gt;路线检查&lt;/strong&gt;&lt;p&gt;从入口可到达两个结局。单个场景的对白在场景编辑器里修改。&lt;/p&gt;&lt;/div&gt;${go(&#x27;打开当前场景&#x27;,&#x27;writing&#x27;,&#x27;wd-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
function characters(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;角色&#x27;,&#x27;角色名、表情与立绘集中管理。&#x27;,btn(&#x27;＋ 新建角色&#x27;,&#x27;character-new&#x27;,&#x27;wd-primary&#x27;))}${table([&#x27;角色&#x27;,&#x27;立绘与表情&#x27;,&#x27;引用&#x27;,&#x27;操作&#x27;],[[&#x27;&lt;span class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-avatar&quot;&gt;夏&lt;/span&gt;夏音&lt;/span&gt;&#x27;,&#x27;普通 / 微笑 / 难过&#x27;,&#x27;4 个场景&#x27;,btn(&#x27;编辑&#x27;,&#x27;character-edit&#x27;)],[&#x27;主角&#x27;,&#x27;以文字为主&#x27;,&#x27;4 个场景&#x27;,btn(&#x27;编辑&#x27;,&#x27;character-edit&#x27;)]])}&lt;/div&gt;`;}
function variables(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;变量&#x27;,&#x27;在选项和条件中使用，不需要每次记住变量 ID。&#x27;,btn(&#x27;＋ 新建变量&#x27;,&#x27;variable-new&#x27;,&#x27;wd-primary&#x27;))}${table([&#x27;名称&#x27;,&#x27;类型 / 初始值&#x27;,&#x27;用途&#x27;,&#x27;操作&#x27;],[[&#x27;与夏音的关系&#x27;,&#x27;数字 · 0&#x27;,&#x27;3 处条件&#x27;,btn(&#x27;编辑&#x27;,&#x27;variable-edit&#x27;)],[&#x27;是否留在车站&#x27;,&#x27;开关 · 关闭&#x27;,&#x27;2 处条件&#x27;,btn(&#x27;编辑&#x27;,&#x27;variable-edit&#x27;)]])}&lt;/div&gt;`;}

function localization(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;本地化与配音&#x27;,&#x27;源语言：简体中文&#x27;,btn(&#x27;添加语言&#x27;,&#x27;add-locale&#x27;)+btn(&#x27;导入翻译&#x27;,&#x27;import-locale&#x27;)+btn(&#x27;导出翻译表&#x27;,&#x27;export-locale&#x27;))}&lt;div class=&quot;wd-toolbar&quot;&gt;&lt;label class=&quot;wd-row&quot;&gt;目标语言 ${select([&#x27;日本語&#x27;,&#x27;English&#x27;],&#x27;wd-locale&#x27;,state.locale)}&lt;/label&gt;&lt;span class=&quot;wd-muted wd-small&quot;&gt;选中一行后翻译，不在素材页同时展开所有生产表。&lt;/span&gt;&lt;/div&gt;${table([&#x27;源文本&#x27;,&#x27;译文&#x27;,&#x27;状态&#x27;,&#x27;操作&#x27;],[[esc(state.dialogue[0]),&#x27;雨が止んだね。あの約束、覚えてる？&#x27;,&#x27;待复核&#x27;,btn(&#x27;编辑&#x27;,&#x27;translation&#x27;)],[esc(state.dialogue[1]),&#x27;もちろん。ずっと覚えている。&#x27;,&#x27;已完成&#x27;,btn(&#x27;编辑&#x27;,&#x27;translation&#x27;)],[&#x27;走向海边&#x27;,&#x27;未翻译&#x27;,&#x27;未翻译&#x27;,btn(&#x27;编辑&#x27;,&#x27;translation&#x27;)]])}&lt;/div&gt;`;}
function collections(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;内容收录&#x27;,&#x27;设置玩家何时能在回忆页看见内容。&#x27;,btn(&#x27;＋ 新建收录项&#x27;,&#x27;collection-edit&#x27;,&#x27;wd-primary&#x27;))}&lt;div class=&quot;wd-filter&quot;&gt;${[&#x27;画廊&#x27;,&#x27;音乐室&#x27;,&#x27;结局&#x27;,&#x27;场景回想&#x27;].map(x=&gt;btn(x,`collection-tab:${x}`,state.collectionTab===x?&#x27;active&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div style=&quot;margin-top:20px&quot;&gt;${table([&#x27;内容&#x27;,&#x27;解锁条件&#x27;,&#x27;展示&#x27;,&#x27;操作&#x27;],[[state.collectionTab===&#x27;音乐室&#x27;?&#x27;雨停之后&#x27;:&#x27;雨中的车站&#x27;,&#x27;在故事中首次出现&#x27;,&#x27;锁定时隐藏名称&#x27;,btn(&#x27;编辑&#x27;,&#x27;collection-edit&#x27;)],[state.collectionTab===&#x27;结局&#x27;?&#x27;向着大海&#x27;:&#x27;海边黄昏&#x27;,&#x27;到达结局「向着大海」&#x27;,&#x27;未解锁时显示占位&#x27;,btn(&#x27;编辑&#x27;,&#x27;collection-edit&#x27;)]])}&lt;/div&gt;&lt;/div&gt;`;}
function appearance(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;游戏界面&#x27;,&#x27;编辑玩家看到的标题、对话框与菜单。&#x27;,btn(&#x27;更换游戏主题&#x27;,&#x27;game-theme&#x27;))}&lt;div class=&quot;wd-filter&quot;&gt;${[&#x27;对话框&#x27;,&#x27;标题页&#x27;,&#x27;选择&#x27;,&#x27;菜单&#x27;].map(x=&gt;btn(x,`ui-tab:${x}`,state.uiTab===x?&#x27;active&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;wd-stage-layout&quot; style=&quot;margin-top:20px&quot;&gt;&lt;div&gt;${art(state.uiTab===&#x27;标题页&#x27;?&#x27;雨后的约定&#x27;:state.dialogue[0])}&lt;div class=&quot;wd-row&quot; style=&quot;margin-top:14px&quot;&gt;${btn(&#x27;编辑布局&#x27;,&#x27;ui-layout&#x27;)}${go(&#x27;试玩实际界面&#x27;,&#x27;player-title&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;wd-stage-properties&quot;&gt;&lt;h3&gt;${state.uiTab}样式&lt;/h3&gt;${field(&#x27;布局&#x27;,select([&#x27;底部对话框&#x27;,&#x27;全屏文字&#x27;,&#x27;气泡&#x27;]))}${field(&#x27;字体大小&#x27;,input(&#x27;24&#x27;))}${field(&#x27;背景透明度&#x27;,&#x27;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;85&quot; aria-label=&quot;背景透明度&quot;&gt;&#x27;)}&lt;details&gt;&lt;summary&gt;安全区与高级排版&lt;/summary&gt;${field(&#x27;边距&#x27;,input(&#x27;32&#x27;))}&lt;/details&gt;&lt;/aside&gt;&lt;/div&gt;&lt;p class=&quot;wd-muted wd-small&quot; style=&quot;margin-top:20px&quot;&gt;编辑器主题在设置中选择，游戏外观随工程交付。&lt;/p&gt;&lt;/div&gt;`;}
function defaults(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;玩家默认设置&#x27;,&#x27;首次启动游戏时的默认值，玩家之后可以自行调整。&#x27;)}&lt;div class=&quot;wd-settings-layout&quot;&gt;&lt;aside class=&quot;wd-settings-nav&quot;&gt;${[&#x27;文本与阅读&#x27;,&#x27;声音&#x27;,&#x27;输入与无障碍&#x27;,&#x27;平台覆盖&#x27;].map(x=&gt;btn(x,`default-section:${x}`,state.settingSection===x?&#x27;active&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/aside&gt;&lt;section&gt;&lt;h2&gt;${[&#x27;文本与阅读&#x27;,&#x27;声音&#x27;,&#x27;输入与无障碍&#x27;,&#x27;平台覆盖&#x27;].includes(state.settingSection)?state.settingSection:&#x27;文本与阅读&#x27;}&lt;/h2&gt;${field(&#x27;文字显示&#x27;,select([&#x27;逐字显示&#x27;,&#x27;立即显示&#x27;]))}${field(&#x27;文字速度&#x27;,&#x27;&lt;input type=&quot;range&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;50&quot; aria-label=&quot;默认文字速度&quot;&gt;&#x27;)}${field(&#x27;自动播放等待&#x27;,input(&#x27;2 秒&#x27;))}&lt;label class=&quot;wd-field&quot;&gt;&lt;input type=&quot;checkbox&quot; checked&gt; 语音结束后再推进&lt;/label&gt;&lt;details&gt;&lt;summary&gt;平台覆盖&lt;/summary&gt;${field(&#x27;使用独立配置的平台&#x27;,select([&#x27;跟随项目&#x27;,&#x27;Windows&#x27;,&#x27;Web&#x27;,&#x27;Android&#x27;]))}&lt;p class=&quot;wd-muted wd-small&quot;&gt;只有需要不同表现时才覆盖默认值。&lt;/p&gt;&lt;/details&gt;${btn(&#x27;保存默认设置&#x27;,&#x27;save-local&#x27;,&#x27;wd-primary&#x27;)}&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;`;}
function issues(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;问题检查&#x27;,&#x27;先看会阻止试玩和发布的问题。&#x27;,btn(&#x27;重新检查&#x27;,&#x27;run-check&#x27;,&#x27;wd-primary&#x27;))}&lt;div class=&quot;wd-filter&quot;&gt;${btn(&#x27;全部（3）&#x27;,&#x27;issue-filter:all&#x27;,&#x27;active&#x27;)}${btn(&#x27;阻止运行（1）&#x27;,&#x27;issue-filter:errors&#x27;)}${btn(&#x27;提醒（2）&#x27;,&#x27;issue-filter:warnings&#x27;)}&lt;/div&gt;${[[&#x27;缺少背景素材&#x27;,&#x27;第一章 / 雨中的车站&#x27;,&#x27;重新关联素材&#x27;,&#x27;repair&#x27;],[&#x27;有一处未翻译的选项&#x27;,&#x27;本地化 / 日本語&#x27;,&#x27;去翻译&#x27;,&#x27;go:localization&#x27;],[&#x27;场景没有连接到结局&#x27;,&#x27;第一章 / 校门口&#x27;,&#x27;查看路线&#x27;,&#x27;go:flow&#x27;]].map(([t,p,l,a],i)=&gt;`&lt;div class=&quot;wd-list-row&quot; data-issue-level=&quot;${i?&#x27;warnings&#x27;:&#x27;errors&#x27;}&quot;&gt;&lt;div&gt;&lt;strong&gt;${i?&#x27;△&#x27;:&#x27;!&#x27;} ${t}&lt;/strong&gt;&lt;p&gt;${p}&lt;/p&gt;&lt;/div&gt;${btn(l,a)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;details&gt;&lt;summary&gt;已忽略的问题&lt;/summary&gt;&lt;p class=&quot;wd-muted&quot;&gt;忽略必须写明理由，可随时恢复检查。&lt;/p&gt;${btn(&#x27;忽略选中的提醒&#x27;,&#x27;suppress&#x27;)}&lt;/details&gt;&lt;/div&gt;`;}
function debug(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;运行调试&#x27;,&#x27;从当前场景开始，检查分支和变量。&#x27;,btn(&#x27;▷ 开始调试&#x27;,&#x27;debug-start&#x27;,&#x27;wd-primary&#x27;)+go(&#x27;回到场景&#x27;,&#x27;writing&#x27;))}&lt;div class=&quot;wd-stage-layout&quot;&gt;&lt;div&gt;${art(state.dialogue[0])}&lt;div class=&quot;wd-row&quot; style=&quot;margin-top:16px&quot;&gt;${btn(&#x27;继续&#x27;,&#x27;debug-continue&#x27;)}${btn(&#x27;下一步&#x27;,&#x27;debug-step&#x27;)}${btn(&#x27;停止&#x27;,&#x27;debug-stop&#x27;)}&lt;/div&gt;&lt;p id=&quot;wd-debug-status&quot; class=&quot;wd-muted wd-small&quot; style=&quot;margin-top:12px&quot;&gt;未运行 · 雨中的车站&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;wd-stage-properties&quot;&gt;&lt;h3&gt;变量&lt;/h3&gt;&lt;div class=&quot;wd-list-row&quot;&gt;&lt;span&gt;与夏音的关系&lt;/span&gt;&lt;strong id=&quot;wd-debug-value&quot;&gt;0&lt;/strong&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;断点与观察表达式&lt;/summary&gt;&lt;p&gt;车站 / 第一条对白&lt;/p&gt;${btn(&#x27;添加观察项&#x27;,&#x27;watch&#x27;)}&lt;/details&gt;&lt;details&gt;&lt;summary&gt;运行日志与调用栈&lt;/summary&gt;&lt;p class=&quot;wd-muted wd-small&quot;&gt;运行后展开查看。故障可以直接定位到源语句。&lt;/p&gt;&lt;/details&gt;&lt;/aside&gt;&lt;/div&gt;&lt;/div&gt;`;}
function publish(){let content=&#x27;&#x27;;if(state.publishStep===1)content=`&lt;h2&gt;选择发布平台&lt;/h2&gt;&lt;div class=&quot;wd-options&quot;&gt;${[&#x27;Web&#x27;,&#x27;Windows&#x27;,&#x27;Android&#x27;].map(x=&gt;btn(x+`&lt;small&gt;${x===&#x27;Web&#x27;?&#x27;浏览器与离线网页&#x27;:x===&#x27;Windows&#x27;?&#x27;桌面程序&#x27;:&#x27;当前尚未开放&#x27;}&lt;/small&gt;`,`target:${x}`,x===state.target?&#x27;active&#x27;:&#x27;&#x27;,x===&#x27;Android&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;h3&gt;导出形式&lt;/h3&gt;${field(&#x27;交付文件&#x27;,select(state.target===&#x27;Web&#x27;?[&#x27;单文件网页&#x27;,&#x27;网页目录 ZIP&#x27;]:[&#x27;Windows 安装包&#x27;,&#x27;Windows 便携目录&#x27;]))}&lt;details&gt;&lt;summary&gt;高级资源优化&lt;/summary&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; checked&gt; 安全无损优化&lt;/label&gt;&lt;p class=&quot;wd-muted wd-small&quot;&gt;检测无收益或不支持的资源时使用原素材。完整报告在导出后查看。&lt;/p&gt;&lt;/details&gt;${btn(&#x27;下一步：检查工程&#x27;,&#x27;publish-next&#x27;,&#x27;wd-primary&#x27;)}`;else if(state.publishStep===2)content=`&lt;h2&gt;导出前检查&lt;/h2&gt;${[&#x27;故事入口与场景引用&#x27;,&#x27;素材完整性&#x27;,&#x27;存档与玩家配置&#x27;].map(x=&gt;`&lt;div class=&quot;wd-list-row&quot;&gt;&lt;span&gt;${x}&lt;/span&gt;&lt;span style=&quot;color:var(--wd-ok)&quot;&gt;✓ 示例通过&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;wd-row&quot; style=&quot;margin-top:24px&quot;&gt;${btn(&#x27;上一步&#x27;,&#x27;publish-prev&#x27;)}${btn(&#x27;生成游戏文件&#x27;,&#x27;publish-next&#x27;,&#x27;wd-primary&#x27;)}&lt;/div&gt;`;else content=`&lt;div class=&quot;wd-empty&quot; style=&quot;padding:45px 0&quot;&gt;&lt;span style=&quot;font-size:34px;color:var(--wd-ok)&quot;&gt;✓&lt;/span&gt;&lt;h2&gt;导出结果示例&lt;/h2&gt;&lt;p&gt;雨后的约定 · ${state.target===&#x27;Web&#x27;?&#x27;单文件网页&#x27;:&#x27;Windows 程序&#x27;}&lt;br&gt;这里展示成功后的界面，原型不会生成真实游戏文件。&lt;/p&gt;&lt;div class=&quot;wd-row&quot; style=&quot;justify-content:center&quot;&gt;${go(&#x27;试玩界面&#x27;,&#x27;player-title&#x27;,&#x27;wd-primary&#x27;)}${btn(&#x27;查看交付清单&#x27;,&#x27;build-result&#x27;)}${btn(&#x27;重新导出&#x27;,&#x27;publish-reset&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;优化报告与构建日志&lt;/summary&gt;&lt;p class=&quot;wd-muted&quot;&gt;报告独立查看，不进入写作预览栏。此处为结构示例。&lt;/p&gt;&lt;/details&gt;`;return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;发布游戏&#x27;,&#x27;把工程交给玩家。发布设置集中在这里。&#x27;)}&lt;div class=&quot;wd-steps&quot;&gt;${[&#x27;平台与形式&#x27;,&#x27;检查工程&#x27;,&#x27;导出结果&#x27;].map((x,i)=&gt;`&lt;span class=&quot;${state.publishStep===i+1?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;${i+1} · ${x}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section style=&quot;max-width:650px&quot;&gt;${content}&lt;/section&gt;&lt;/div&gt;`;}
function settings(){const sections=[&#x27;基本信息&#x27;,&#x27;编辑器外观&#x27;,&#x27;保存与备份&#x27;,&#x27;显示与平台&#x27;,&#x27;高级&#x27;];let content=state.settingSection===&#x27;编辑器外观&#x27;?`${field(&#x27;编辑器主题&#x27;,`&lt;select id=&quot;wd-setting-theme&quot;&gt;${[[&#x27;light&#x27;,&#x27;晴空 · 浅色&#x27;],[&#x27;dark&#x27;,&#x27;夜航 · 深色&#x27;],[&#x27;paper&#x27;,&#x27;暖纸 · 写作&#x27;],[&#x27;system&#x27;,&#x27;跟随系统&#x27;]].map(([v,l])=&gt;`&lt;option value=&quot;${v}&quot; ${state.theme===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${l}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;`,&#x27;主题只影响编辑器，不改游戏内容。&#x27;)}${field(&#x27;动效&#x27;,select([&#x27;跟随系统&#x27;,&#x27;标准&#x27;,&#x27;减少&#x27;]))}${field(&#x27;界面密度&#x27;,select([&#x27;舒适&#x27;,&#x27;紧凑&#x27;]))}`:state.settingSection===&#x27;保存与备份&#x27;?`${field(&#x27;自动保存&#x27;,select([&#x27;开启&#x27;,&#x27;关闭&#x27;]))}&lt;p class=&quot;wd-muted&quot;&gt;最近保存与恢复记录在独立页面管理。&lt;/p&gt;${go(&#x27;查看备份与恢复&#x27;,&#x27;backup&#x27;)}${btn(&#x27;导出工程副本&#x27;,&#x27;export-project&#x27;)}`:state.settingSection===&#x27;显示与平台&#x27;?`${field(&#x27;游戏方向&#x27;,select([&#x27;横屏&#x27;,&#x27;竖屏&#x27;,&#x27;自适应&#x27;]))}${field(&#x27;设计分辨率&#x27;,select([&#x27;1920 × 1080&#x27;,&#x27;1280 × 720&#x27;,&#x27;1080 × 1920&#x27;]))}${field(&#x27;安全区&#x27;,select([&#x27;跟随系统&#x27;,&#x27;固定边距&#x27;]))}`:state.settingSection===&#x27;高级&#x27;?`&lt;details open&gt;&lt;summary&gt;工程兼容信息&lt;/summary&gt;&lt;p class=&quot;wd-muted&quot;&gt;格式版本与诊断信息只在这里展示，复制报告时包含。&lt;/p&gt;${btn(&#x27;复制诊断信息&#x27;,&#x27;copy-diagnostic&#x27;)}&lt;/details&gt;&lt;hr class=&quot;wd-divider&quot;&gt;${btn(&#x27;删除本机工程&#x27;,&#x27;delete-project&#x27;,&#x27;wd-danger&#x27;)}`:`${field(&#x27;工程名称&#x27;,input(state.project,&#x27;wd-project-name&#x27;))}${field(&#x27;作者&#x27;,input(&#x27;&#x27;))}${field(&#x27;作品简介&#x27;,&#x27;&lt;textarea&gt;雨停之后，我们再一次走向那个约定。&lt;/textarea&gt;&#x27;)}`;return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;项目设置&#x27;)}&lt;div class=&quot;wd-settings-layout&quot;&gt;&lt;aside class=&quot;wd-settings-nav&quot;&gt;${sections.map(x=&gt;btn(x,`setting-section:${x}`,state.settingSection===x?&#x27;active&#x27;:&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/aside&gt;&lt;section&gt;&lt;h2&gt;${sections.includes(state.settingSection)?state.settingSection:&#x27;基本信息&#x27;}&lt;/h2&gt;${content}&lt;div style=&quot;margin-top:25px&quot;&gt;${btn(&#x27;保存设置&#x27;,&#x27;save-settings&#x27;,&#x27;wd-primary&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;`;}
function backup(){return `&lt;div class=&quot;wd-page&quot;&gt;${heading(&#x27;备份与恢复&#x27;,&#x27;恢复前先预览变化，保留当前工程副本。&#x27;,btn(&#x27;导出工程副本&#x27;,&#x27;export-project&#x27;,&#x27;wd-primary&#x27;))}${[&#x27;今天 10:24 · 自动保存&#x27;,&#x27;今天 09:40 · 手动保存&#x27;,&#x27;昨天 18:32 · 手动保存&#x27;].map((x,i)=&gt;`&lt;div class=&quot;wd-list-row&quot;&gt;&lt;div&gt;&lt;strong&gt;${x}&lt;/strong&gt;&lt;p&gt;${i?&#x27;第一章 / 雨中的车站&#x27;:&#x27;当前版本&#x27;} · 含剧情与素材索引&lt;/p&gt;&lt;/div&gt;${btn(&#x27;预览恢复&#x27;,`restore:${i}`)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;wd-muted wd-small&quot; style=&quot;margin-top:20px&quot;&gt;跨设备使用工程 ZIP；玩家存档在游戏中管理。&lt;/p&gt;&lt;/div&gt;`;}
